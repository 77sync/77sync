<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Roadmap: Luau basics, Roblox services, game systems, pro developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
    .fg-fill { fill: #111111; }
    .fg-line { stroke: #111111; }
    .mute { fill: #7a7a7a; }
    .bg-fill { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .fg-fill { fill: #f2f2f2; }
      .fg-line { stroke: #f2f2f2; }
      .mute { fill: #8c8c8c; }
      .bg-fill { fill: #0d1117; }
    }

    .label { font-size: 11px; letter-spacing: 4px; }
    .num   { font-size: 11px; letter-spacing: 1px; text-anchor: middle; }
    .name  { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .desc  { font-size: 11px; text-anchor: middle; }

    .track { stroke-width: 1; fill: none; }
    .draw  { stroke-width: 1.5; fill: none; stroke-dasharray: 660; animation: draw 2.2s ease-out backwards; }
    .node  { stroke-width: 1.5; animation: pop .5s ease-out backwards; transform-box: fill-box; transform-origin: center; }
    .halo  { fill: none; stroke-width: 1; transform-box: fill-box; transform-origin: center; animation: halo 2.8s ease-out infinite; }
    .fade  { animation: fade .6s ease-out backwards; }

    .d1 { animation-delay: .2s; }
    .d2 { animation-delay: .9s; }
    .d3 { animation-delay: 1.5s; }
    .d4 { animation-delay: 2.1s; }

    @keyframes draw { from { stroke-dashoffset: 660; } to { stroke-dashoffset: 0; } }
    @keyframes pop  { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes halo { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(3); opacity: 0; } }
  </style>

  <text x="40" y="38" class="label mute">ROADMAP</text>

  <line x1="120" y1="100" x2="780" y2="100" class="track fg-line" opacity=".2"/>
  <line x1="120" y1="100" x2="780" y2="100" class="draw fg-line"/>

  <g class="fade d1">
    <text x="120" y="76" class="num mute">01</text>
    <text x="120" y="142" class="name fg-fill">Luau basics</text>
    <text x="120" y="162" class="desc mute">syntax, loops, functions</text>
  </g>
  <circle cx="120" cy="100" r="6" class="halo fg-line"/>
  <circle cx="120" cy="100" r="6" class="node fg-fill fg-line d1"/>

  <g class="fade d2">
    <text x="340" y="76" class="num mute">02</text>
    <text x="340" y="142" class="name fg-fill">Roblox services</text>
    <text x="340" y="162" class="desc mute">events, workspace, players</text>
  </g>
  <circle cx="340" cy="100" r="6" class="node bg-fill fg-line d2"/>

  <g class="fade d3">
    <text x="560" y="76" class="num mute">03</text>
    <text x="560" y="142" class="name fg-fill">Game systems</text>
    <text x="560" y="162" class="desc mute">oop, datastore, remotes</text>
  </g>
  <circle cx="560" cy="100" r="6" class="node bg-fill fg-line d3"/>

  <g class="fade d4">
    <text x="780" y="76" class="num mute">04</text>
    <text x="780" y="142" class="name fg-fill">Pro developer</text>
    <text x="780" y="162" class="desc mute">optimize, polish, publish</text>
  </g>
  <circle cx="780" cy="100" r="6" class="node bg-fill fg-line d4"/>
</svg>
